name: Origin War remake
on:
  push:
    branches: [codex/origin-war-squidsquad]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew.bat test :lwjgl3:installDist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results
          path: |
            core/build/test-results/test/*.xml
            lwjgl3/build/test-results/test/*.xml
          retention-days: 14
