allprojects {
    group = 'io.zipcoder.originwar'
    version = '0.1.0'
    repositories { mavenCentral(); maven { url = uri('https://jitpack.io') } }
}
subprojects {
    apply plugin: 'java'
    java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
    dependencies {
        testImplementation platform('org.junit:junit-bom:5.12.2')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    test { useJUnitPlatform(); testLogging { events 'failed', 'skipped' } }
}

tasks.register('verifyAssets') {
    group='verification'
    description='Validate required runtime image dimensions, audio hashes and upstream notice payloads.'
    doLast {
        def sizes=['art/station.png':[1024,1024],'art/animation/actors.png':[1024,1024],
            'art/sectors/sectors.png':[1024,512],'art/finale/finale.png':[1024,512],
            'art/animation/directional-actions/attack.png':[1024,384],
            'art/animation/humans/humans.png':[1024,128],'art/atmosphere/player-walk.png':[512,512],'ui/ui.png':[1024,1024]]
        sizes.each { path,size ->
            def image=javax.imageio.ImageIO.read(file('assets/'+path))
            if(image==null||image.width!=size[0]||image.height!=size[1])throw new GradleException('Invalid runtime art: '+path)
        }
        def digest={f -> java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()}
        def art=new groovy.json.JsonSlurper().parse(file('assets/art/atmosphere/manifest.json'))
        (art.sources+art.outputs).each { path,hash -> if(!path.startsWith('assets/art/')||!file(path).isFile()||digest(file(path))!=hash)throw new GradleException('Art source/export mismatch: '+path) }
        def uiFont=new groovy.json.JsonSlurper().parse(file('assets/ui/manifest.json'))
        if(digest(file('assets/ui/source/LiberationSans-Regular.ttf'))!=uiFont.source_sha256)throw new GradleException('UI font source mismatch')
        uiFont.outputs.each { path,hash -> if(!file('assets/ui/'+path).isFile()||digest(file('assets/ui/'+path))!=hash)throw new GradleException('UI font mismatch: '+path) }
        def audio=new groovy.json.JsonSlurper().parse(file('assets/audio/manifest.json'))
        if(audio.music.size()!=6||audio.sfx.size()!=34||audio.ambience.size()!=6)throw new GradleException('Incomplete soundtrack/effects/suit layers')
        (audio.music.values()+audio.sfx.values()+audio.ambience.values()).each { item ->
            if(!file(item.path).isFile()||digest(file(item.path))!=item.sha256)throw new GradleException('Audio hash mismatch: '+item.path)
        }
        def voices=new groovy.json.JsonSlurper().parse(file('assets/audio/voice/index.json'))
        if(voices.clips.size()!=9)throw new GradleException('Incomplete ALICE voice catalog')
        voices.clips.each { item -> if(!item.path.startsWith('audio/voice/')||digest(file('assets/'+item.path))!=item.sha256)throw new GradleException('Voice hash mismatch: '+item.path) }
        def cues=new groovy.json.JsonSlurper().parse(file('assets/audio/runtime.json'))
        if(cues.sfx.keySet()!=audio.sfx.keySet())throw new GradleException('Effect duration catalog mismatch')
        cues.sfx.each { id,seconds -> if(Math.abs(seconds-audio.sfx[id].duration_seconds)>.0001)throw new GradleException('Effect duration mismatch: '+id) }
        def notices=new groovy.json.JsonSlurper().parse(file('licenses/MANIFEST.json'))
        notices.each { path,entry -> if(!file('licenses/'+path).isFile()||digest(file('licenses/'+path))!=entry.sha256)throw new GradleException('Notice hash mismatch: '+path) }
        logger.lifecycle('Validated art sources/exports, 6 music roles, 6 suit layers, 9 ALICE clips, '+audio.sfx.size()+' effects and '+notices.size()+' upstream notices.')
    }
}
